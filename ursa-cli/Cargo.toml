[package]
name = "ursa-cli"
description = "The ursa command-line tool: SQL over Parquet, CSV, JSON and Arrow files, local or in object storage."
# The SQL engine and CLI are versioned on their own: 0.6 is their first
# release. The Python package (ursa-graph) follows the workspace version.
version = "0.13.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://cldixon.github.io/ursa/sql/"
documentation = "https://cldixon.github.io/ursa/sql/"
keywords = ["sql", "graph", "cli", "parquet", "datafusion"]
categories = ["command-line-utilities", "database", "algorithms"]

[[bin]]
name = "ursa"
path = "src/main.rs"

[features]
default = ["aws-profile"]
# Read S3 credentials from AWS profile files (~/.aws/config, ~/.aws/credentials,
# AWS_PROFILE) through aws-config. Without it, S3 credentials come only from the
# environment and the machine's role.
aws-profile = ["ursa-engine/aws-profile"]
# `ursa serve`: the shell in a browser tab, over a local WebSocket to this
# process's engine (ursa-server, design/console.md §5). The page's files come
# from `--assets DIR` (a `web/dist` built by `bun run build`), or, in a
# checkout, its own `web/dist`.
serve = ["dep:ursa-server"]
# `serve` with the page's files built into the binary: builds only from a
# checkout, after `cd web && bun scripts/build.ts --no-engine` (`bun run
# build` without the wasm engine, which `ursa serve` does not use). The
# release binaries have it (.github/workflows/cli-build.yml); the published
# crate does not.
serve-embed = ["serve", "ursa-server/embed"]

[dependencies]
ursa-engine = { path = "../ursa-engine", version = "0.13.0" }
ursa-sql = { path = "../ursa-sql", version = "0.13.0" }
ursa-shell = { path = "../ursa-shell", version = "0.13.0", features = ["clap"] }
ursa-server = { path = "../ursa-server", version = "0.13.0", optional = true }
datafusion = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal"] }
# Line editing for the shell: the version datafusion-cli 54 uses.
rustyline = "18.0"
# The terminal's width, so tables fit it.
terminal_size = "0.4"

[dev-dependencies]
tempfile = "3"
# Builds the Parquet fixtures in tests/database.rs.
arrow = { workspace = true }
# Reads `ursa --format json` in tests/docs.rs (the function reference generator).
serde_json = "1"
# Writes the gzip CSV fixture (already in the tree via DataFusion's compression).
flate2 = "1"

# Drives the shell through a pseudo-terminal in tests/shell_pty.rs (Unix only).
[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.7"
