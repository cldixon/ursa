# Ursa — Cargo workspace.
#
# Layout mirrors the spec's crate split:
#   ursa-core  — pure-Rust topology + algorithm kernels (arrow + rayon, NO DataFusion)
#   ursa-plan  — DataFusion extensions: custom plan nodes + ExecutionPlans -> ursa-core
#   ursa-py    — PyO3 bindings (thin)
[workspace]
resolver = "2"
members = ["ursa-core", "ursa-plan", "ursa-py"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cldixon/ursa"
authors = ["Ursa contributors"]

# NOTE: these versions are a *coherence target* for the first full build. arrow,
# datafusion, object_store and pyo3 are cross-coupled (datafusion re-exports a
# specific arrow; arrow's `pyarrow` feature pins a specific pyo3). If the first
# `cargo update` surfaces a conflict, bump the whole set together, not piecemeal.
[workspace.dependencies]
arrow = "54"
rayon = "1.10"
datafusion = "45"
# Cloud backends (S3/GCS/Azure) are enabled here so scan_edges/scan_nodes can read
# from object storage. These features pull in an HTTP client + TLS (rustls) + XML.
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
pyo3 = "0.23"
url = "2"
# Seeded PRNG for the stochastic kernels (random_walk). ChaCha gives a portable,
# reproducible stream so a fixed seed yields identical walks across runs/machines.
rand = "0.8"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
