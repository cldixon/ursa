[package]
name = "ursa-wasm"
description = "Ursa's SQL engine in the browser: ursa-sql compiled to WebAssembly, with a JavaScript API (wasm-bindgen)."
version = "0.9.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Built for wasm32-unknown-unknown with `wasm-bindgen` (see README.md). It also
# builds natively, so `cargo check --workspace` and clippy cover it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ursa-engine = { path = "../ursa-engine", version = "0.9.0-dev" }
ursa-sql = { path = "../ursa-sql", version = "0.9.0-dev" }
ursa-shell = { path = "../ursa-shell", version = "0.9.0-dev" }
arrow = { workspace = true, features = ["prettyprint", "ipc"] }
datafusion = { workspace = true }
futures = "0.3"
serde_json = "1"
url = { workspace = true }
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# DataFusion's `now()` and friends read the clock through chrono, which needs
# its JavaScript binding in the browser (as in DataFusion's `wasmtest`).
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
# Panics print their message to the browser console instead of "unreachable".
console_error_panic_hook = "0.1.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
