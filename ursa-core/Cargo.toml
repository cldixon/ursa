[package]
name = "ursa-core"
description = "Topology index and graph algorithm kernels for Ursa. Pure Rust; no DataFusion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The library has no `#[bench]`s; without this, `cargo bench -p ursa-core -- <criterion
# flags>` also runs the lib's libtest harness, which rejects flags like
# `--save-baseline`.
bench = false

[dependencies]
arrow = { workspace = true }
rayon = { workspace = true, optional = true }
# Kernels use only *seeded* ChaCha streams (never OS entropy), so `rand` is pinned
# without default features at the workspace root — keeping `getrandom` out of the tree
# is what lets this crate target `wasm32-unknown-unknown`. rand_chacha supplies the
# PRNG; rand supplies only the `Rng`/`SeedableRng` traits.
rand = { workspace = true }
rand_chacha = { workspace = true }
rustc-hash = "2"
# `HashTable` indexes string ids by dense index without storing a key per entry.
hashbrown = { version = "0.15", default-features = false }

[features]
# `rayon` is on by default: the normal build is multi-threaded. Turning it off
# (`--no-default-features`) drops the thread pool and every kernel falls back to an
# ordered serial path (see `src/parallel.rs`) — the build that targets
# `wasm32-unknown-unknown`, where threads need SharedArrayBuffer + COOP/COEP headers
# that a static host can't assume. The serial and parallel outputs are bit-identical.
default = ["rayon"]
rayon = ["dep:rayon"]

[dev-dependencies]
# The determinism-across-thread-counts test (tests/determinism_threads.rs) pins
# the rayon pool size per run; rayon is a normal dep but integration-test crates
# only see dev-deps, so it is declared here too.
rayon = { workspace = true }
# Micro-benchmarks (benches/kernels.rs, #178). Default features off: no plotters
# (no chart rendering) and no rayon inside criterion's own analysis, so the bench
# harness never competes with the kernels' pool. Dev-only, so it never reaches the
# `--no-default-features` / wasm32 checks.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "kernels"
harness = false
