[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
# Distribution name is `ursa-graph` (the bare `ursa` is an abandoned, file-less
# reservation on PyPI). The *import* name is unaffected — `import ursa` — because
# it is set by the module layout below (`module-name`/`python-source`), not by the
# distribution name. So: `pip install ursa-graph`, then `import ursa`.
name = "ursa-graph"
# Version is single-sourced from the Cargo workspace (`[workspace.package] version`
# in the root Cargo.toml, inherited by ursa-py). maturin reads it at build time.
dynamic = ["version"]
description = "Polars-shaped dataframes for graph data — a Rust/Arrow/DataFusion graph analytics library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Ursa contributors" }]
keywords = ["graph", "analytics", "arrow", "datafusion", "polars", "dataframe"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # typing.Self backport for the 3.10 floor (used only in type annotations).
    "typing-extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
# polars is a real *runtime* optional dependency, used ONLY by the interop shims
# (.to_polars / ur.from_polars). Installed by users who want the interop.
polars = ["polars>=1.0"]

[project.urls]
Homepage = "https://github.com/cldixon/ursa"
Repository = "https://github.com/cldixon/ursa"
Issues = "https://github.com/cldixon/ursa/issues"

# --- uv-managed development tooling (PEP 735 dependency groups) --------------
# Installed by `uv sync`; not part of the published wheel's dependencies.
[dependency-groups]
dev = [
    "maturin>=1.5,<2.0",
    "pytest>=8.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "ruff>=0.14",
    "ty>=0.0.1a1",
    # always present for the type checker, even on 3.11+ where the runtime
    # marker below would otherwise exclude it.
    "typing-extensions>=4.0",
]

[tool.uv]
# Build/install the maturin extension in editable mode on `uv sync` so the native
# module tracks the Rust source. `uv run pytest` (etc.) rebuilds as needed.
package = true

[tool.maturin]
# Mixed Rust/Python layout: Rust extension `ursa._ursa`, Python source under python/.
manifest-path = "ursa-py/Cargo.toml"
module-name = "ursa._ursa"
python-source = "python"
features = ["pyo3/extension-module"]
# The workspace-root LICENSE files land in each wheel's dist-info, but the sdist is
# built around ursa-py/ and would otherwise omit them — even though maturin still
# writes `License-File:` metadata for them, which PyPI then rejects. Force them into
# the sdist so the declared license files actually exist in the distribution.
include = [
    { path = "LICENSE-MIT", format = "sdist" },
    { path = "LICENSE-APACHE", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- ruff: lint + format ----------------------------------------------------
[tool.ruff]
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "A",    # flake8-builtins
    "RUF",  # ruff-specific
]
# The public API deliberately mirrors the spec's names, which shadow builtins:
# `ur.id()`, `scan_nodes(id=...)`, `from_polars(id=...)`. Allowed by design.
ignore = ["A001", "A002", "A004"]

[tool.ruff.lint.isort]
known-first-party = ["ursa"]

# --- ty: type checking ------------------------------------------------------
[tool.ty.environment]
python-version = "3.10"
# First-party import roots: the package lives under python/.
root = ["python"]

[tool.ty.src]
include = ["python", "tests"]
