[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ursa"
version = "0.1.0"
description = "Polars-shaped dataframes for graph data — a Rust/Arrow/DataFusion graph analytics library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Ursa contributors" }]
keywords = ["graph", "analytics", "arrow", "datafusion", "polars", "dataframe"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# polars is used ONLY by the interop shims (.to_polars / ur.from_polars).
polars = ["polars>=1.0"]
dev = ["maturin>=1.5,<2.0", "pytest>=8.0", "polars>=1.0", "pyarrow>=15.0"]

[project.urls]
Repository = "https://github.com/cldixon/ursa"

[tool.maturin]
# Mixed Rust/Python layout: Rust extension `ursa._ursa`, Python source under python/.
manifest-path = "ursa-py/Cargo.toml"
module-name = "ursa._ursa"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
