[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
# Distribution name is `ursa-graph` (the bare `ursa` is an abandoned, file-less
# reservation on PyPI). The *import* name is unaffected — `import ursa` — because
# it is set by the module layout below (`module-name`/`python-source`), not by the
# distribution name. So: `pip install ursa-graph`, then `import ursa`.
name = "ursa-graph"
# Version is single-sourced from the Cargo workspace (`[workspace.package] version`
# in the root Cargo.toml, inherited by ursa-py). maturin reads it at build time.
dynamic = ["version"]
description = "Polars-shaped dataframes for graph data — a Rust/Arrow/DataFusion graph analytics library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Ursa contributors" }]
keywords = ["graph", "analytics", "arrow", "datafusion", "polars", "dataframe"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Arrow is the interchange format on every path: from_arrow/from_polars ingress,
    # the collect() result (the Rust FFI boundary imports the `pyarrow` module), and
    # the sinks. Not optional in practice — a fresh install is unusable without it.
    "pyarrow>=15.0",
    # typing.Self backport for the 3.10 floor (used only in type annotations).
    "typing-extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Real *runtime* optionals, each used ONLY by the matching interop constructor —
# never imported at `import ursa` time. Installed by users who want that interop.
# `ur.to_polars` / `ur.from_polars`:
polars = ["polars>=1.0"]
# `ur.from_networkx` / `ur.nodes_from_networkx`:
networkx = ["networkx>=3.0"]
# `ur.from_numpy`:
numpy = ["numpy>=1.24"]
# `ur.from_scipy_sparse` (pulls numpy transitively):
scipy = ["scipy>=1.10"]
# Everything at once, for a batteries-included install.
all = ["polars>=1.0", "networkx>=3.0", "numpy>=1.24", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/cldixon/ursa"
Repository = "https://github.com/cldixon/ursa"
Issues = "https://github.com/cldixon/ursa/issues"

# --- uv-managed development tooling (PEP 735 dependency groups) --------------
# Installed by `uv sync`; not part of the published wheel's dependencies.
[dependency-groups]
dev = [
    "maturin>=1.5,<2.0",
    "pytest>=8.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    # pandas is NOT a runtime dependency — the constructors detect it via
    # sys.modules and never import it themselves. It is here only so the tests can
    # exercise the pandas.DataFrame ingress path.
    "pandas>=2.0",
    # Reference implementation for cross-checking the graph kernels (tests only).
    # numpy/scipy back NetworkX's pagerank (its other algorithms are pure-Python).
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "ruff>=0.14",
    "ty>=0.0.1a1",
    # always present for the type checker, even on 3.11+ where the runtime
    # marker below would otherwise exclude it.
    "typing-extensions>=4.0",
]
# The cross-library benchmark harness (benchmarks/ursa_bench) and the comparison
# libraries it races Ursa against. Kept OUT of the default dev env on purpose —
# `uv sync --group bench` opts in, so a plain `uv sync` (and CI's core jobs) stay
# lean. rustworkx (a Rust/PyO3 core) is the honest "real bar"; networkx is the
# correctness oracle / floor; typer+rich back the CLI.
bench = [
    "typer>=0.12",
    "rich>=13.0",
    "rustworkx>=0.15",
    "igraph>=0.11",
    "networkx>=3.0",
    "pyarrow>=15.0",
]

[tool.uv]
# Build/install the maturin extension in editable mode on `uv sync` so the native
# module tracks the Rust source. `uv run pytest` (etc.) rebuilds as needed.
package = true

[tool.maturin]
# Mixed Rust/Python layout: Rust extension `ursa._ursa`, Python source under python/.
manifest-path = "ursa-py/Cargo.toml"
module-name = "ursa._ursa"
python-source = "python"
# ursa-py's own `extension-module` feature (forwards to pyo3/extension-module).
# Kept off by default so `cargo test -p ursa-py` links; maturin turns it on here.
features = ["extension-module"]
# The workspace-root LICENSE files land in each wheel's dist-info, but the sdist is
# built around ursa-py/ and would otherwise omit them — even though maturin still
# writes `License-File:` metadata for them, which PyPI then rejects. Force them into
# the sdist so the declared license files actually exist in the distribution.
include = [
    { path = "LICENSE-MIT", format = "sdist" },
    { path = "LICENSE-APACHE", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# --- ruff: lint + format ----------------------------------------------------
[tool.ruff]
line-length = 100
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "A",    # flake8-builtins
    "RUF",  # ruff-specific
]
# The public API deliberately mirrors the spec's names, which shadow builtins:
# `ur.id()`, `scan_nodes(id=...)`, `from_polars(id=...)`. Allowed by design.
ignore = ["A001", "A002", "A004"]

[tool.ruff.lint.per-file-ignores]
# The benchmark tool (a separate, opt-in package) intentionally uses:
#  - B008: typer's `param = typer.Option(...)` default-value idiom;
#  - RUF001/002/003: unicode in human-facing text (× ≈ µs ✗ and accented graph-
#    model names like Erdős–Rényi / Barabási–Albert) that reads better than ASCII.
"benchmarks/**" = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ursa"]

# --- ty: type checking ------------------------------------------------------
[tool.ty.environment]
python-version = "3.10"
# First-party import roots: the package lives under python/.
root = ["python"]

[tool.ty.src]
include = ["python", "tests"]
