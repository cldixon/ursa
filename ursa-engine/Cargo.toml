[package]
name = "ursa-engine"
description = "Ursa's SQL engine session: a DataFusion session that reads files by path, locally or in object storage."
# The SQL engine and CLI are versioned on their own: 0.6 is their first
# release. The Python package (ursa-graph) follows the workspace version.
version = "0.7.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://cldixon.github.io/ursa/"
keywords = ["sql", "graph", "datafusion", "analytics", "parquet"]
categories = ["database-implementations", "algorithms"]

[dependencies]
# `ursa-core`'s `rayon` feature is native only (below): in the browser the
# kernels take their serial path, whose results are bit-identical (#278).
ursa-core = { path = "../ursa-core", version = "0.7.0-dev", default-features = false }
ursa-io = { path = "../ursa-io", version = "0.7.0-dev" }
datafusion = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }
async-trait = "0.1"
futures = "0.3"
# The glob type DataFusion's `ListingTableUrl` filters a listing with.
glob = "0.3"
# The lock type of `SessionContext::state_weak_ref` (already in the tree via DataFusion).
parking_lot = "0.12"
# The graph index cache's single-flight cell, and running kernels off the async
# workers (already in the tree via DataFusion).
tokio = { version = "1", features = ["rt", "sync"] }
# Reads and writes the .ursa catalog file (already in the tree via ursa-plan).
serde_json = "1"
# The checksum of a stored graph index (already in the tree via flate2).
crc32fast = "1.5"
# AWS profile files for S3 credentials (#264), behind the `aws-profile`
# feature. This is the AWS SDK's own loader, so static keys, SSO, assumed roles
# and credential_process resolve as they do in the AWS CLI. Default features
# are off, which drops its aws-lc TLS stack: SSO and STS calls go through
# rustls with ring, which the tree already has.
aws-config = { version = "1.8", default-features = false, features = ["rt-tokio", "sso", "credentials-process"], optional = true }
aws-credential-types = { version = "1.2", optional = true }
aws-smithy-http-client = { version = "1.1", default-features = false, features = ["rustls-ring"], optional = true }

[features]
# S3 credentials from ~/.aws/config and ~/.aws/credentials (AWS_PROFILE).
aws-profile = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-smithy-http-client"]

# Native only: the local file system and cloud stores do not build for wasm32 (#278).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ursa-core = { path = "../ursa-core", version = "0.7.0-dev", features = ["rayon"] }
object_store = { workspace = true, features = ["fs", "aws", "gcp", "azure"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
