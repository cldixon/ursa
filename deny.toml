# cargo-deny configuration — supply-chain gate for the Rust dependency tree
# (advisories + licenses + sources). Run in CI by .github/workflows/audit.yml on
# every PR/push and weekly, so a new RUSTSEC advisory against an unchanged
# Cargo.lock is caught between releases.

[advisories]
# Fail on any RUSTSEC advisory (vulnerability / unmaintained / unsound) or yanked
# crate in Cargo.lock. The ignore list below waives only *pre-existing transitive*
# advisories that we cannot act on today — every one is pulled by the
# DataFusion → arrow → object_store → pyo3 chain, whose versions are cross-pinned
# (the workspace pins datafusion 55, arrow/arrow-pyarrow 59, pyo3 0.29 and
# object_store 0.13 together; see the root Cargo.toml), so clearing them requires a
# coordinated upgrade, not a change we can make in isolation. `cargo update`
# confirms no in-semver patched version is reachable. Nothing first-party is
# waived, and any NEW advisory in a crate we control still fails the gate.
version = 2
ignore = [
    # quick-xml 0.39.4 — transitive via object_store 0.13's Azure XML path, which
    # requires `quick-xml = "^0.39"`; patched only in 0.41. DoS only, and only on
    # the cloud object-store code path. object_store 0.13 is the line DataFusion 55
    # uses, so the fix waits for a DataFusion release on a newer object_store.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml ^0.39 via object_store 0.13 (Azure); fix is in 0.41, not reachable with DataFusion 55" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml ^0.39 via object_store 0.13 (Azure); fix is in 0.41, not reachable with DataFusion 55" },
]

[licenses]
# Allow-list is exactly the SPDX identifiers present in the current tree (every
# `A OR B` expression resolves to one of these). Anything outside this set fails
# the build, so a new dependency with an unvetted license is a conscious decision.
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    # Permissive compression/hasher backends pulled transitively by parquet/
    # DataFusion's codecs and hashbrown: zlib-rs + miniz_oxide (Zlib), libbz2-rs-sys
    # (bzip2-1.0.6), foldhash (Zlib). Both are OSI/FSF-approved permissive licenses.
    "Zlib",
    "bzip2-1.0.6",
]
# Boost Software License (BSL-1.0), allowed only for the two crates that need it:
# clipboard-win and error-code, which rustyline (the ursa shell's line editor,
# MIT) pulls in on Windows only. Permissive and OSI-approved; kept as per-crate
# exceptions so no other crate can bring it in unreviewed.
exceptions = [
    { allow = ["BSL-1.0"], crate = "clipboard-win" },
    { allow = ["BSL-1.0"], crate = "error-code" },
]

[bans]
# A large transitive tree (DataFusion / Arrow) legitimately pulls duplicate
# versions of some crates; flag them for visibility but don't fail the build.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io (and any explicitly allowed git sources) — an unknown registry or
# git source is a supply-chain red flag.
unknown-registry = "deny"
unknown-git = "deny"
