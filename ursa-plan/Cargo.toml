[package]
name = "ursa-plan"
description = "DataFusion extensions for Ursa: custom plan nodes and ExecutionPlans that call ursa-core, over the sources ursa-io reads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published to crates.io: it ships inside the ursa-graph wheel on PyPI.
publish = false

[dependencies]
ursa-core = { path = "../ursa-core" }
ursa-io = { path = "../ursa-io" }
arrow = { workspace = true }
datafusion = { workspace = true }
rayon = { workspace = true }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
# Grows the stack onto the heap where a walk over a deep plan recurses (#216).
# Already in the tree: DataFusion's own deep-plan guard (`recursive`) uses it.
stacker = "0.1"

[dev-dependencies]
object_store = { workspace = true, features = ["fs", "aws", "gcp", "azure"] }  # native only: ursa-plan does not target wasm32
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
