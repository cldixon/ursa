<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ursa Web Shell</title>
  <meta name="description" content="Graph analytics in SQL, running entirely in your browser: Ursa's engine in WebAssembly over Parquet files.">
  <script>
    // The theme before the first paint: the one picked here before, else the system's.
    try {
      const saved = localStorage.getItem("ursa-theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch {}
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <link rel="modulepreload" href="/engine/ursa_wasm.js">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="bar">
    <nav class="menu" aria-label="Shell">
      <button id="new" type="button" title="Start a new session">New</button>
      <button id="share" type="button" title="Copy a link that replays this session">Share</button>
      <button id="import" type="button" title="Add a CSV, Parquet or JSON file from your computer">Import</button>
      <div class="dropdown">
        <button id="datasets" type="button" aria-haspopup="menu" aria-expanded="false">
          Datasets
          <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="dataset-menu" class="dropdown-menu" role="menu" hidden></div>
      </div>
      <input id="file-input" type="file" multiple hidden
             accept=".csv,.tsv,.parquet,.json,.jsonl,.ndjson,.gz,.zst,.bz2,.xz">
    </nav>
    <a class="brand" href="https://github.com/cldixon/ursa" title="Ursa on GitHub">
      <svg class="logo" viewBox="0 0 22 22" aria-hidden="true">
        <!-- The Big Dipper: Ursa Major's seven bright stars, sized by magnitude. -->
        <path class="logo-line" d="M19.4 4.2 19.2 8.4 15.1 9.1 15.3 5.2 Z M15.3 5.2 11.2 6.0 7.6 4.9 3.2 6.7"/>
        <g class="logo-star">
          <circle cx="19.4" cy="4.2" r="1.5"/><circle cx="15.3" cy="5.2" r="1.0"/>
          <circle cx="15.1" cy="9.1" r="1.15"/><circle cx="19.2" cy="8.4" r="1.2"/>
          <circle cx="11.2" cy="6.0" r="1.85"/><circle cx="7.6" cy="4.9" r="1.3"/>
          <circle cx="3.2" cy="6.7" r="1.7"/>
        </g>
      </svg>
      <span><b>Ursa</b> Web Shell</span>
    </a>
    <div class="right">
      <button id="theme" type="button" class="theme" title="Switch between light and dark" aria-label="Switch between light and dark">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
      </button>
    </div>
  </header>

  <main id="terminal" class="terminal" aria-label="Ursa shell">
    <div id="log" class="log" aria-live="polite"></div>
    <div id="input-line" class="input-line">
      <pre id="prompts" class="prompts" aria-hidden="true">ursa&gt; </pre>
      <div class="editor">
        <pre id="highlight" class="highlight" aria-hidden="true"></pre>
        <textarea id="input" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off"
                  aria-label="SQL or a dot-command; Enter runs a statement ending in ;" disabled></textarea>
      </div>
    </div>
  </main>
</body>
</html>
