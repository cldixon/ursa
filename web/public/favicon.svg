<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.95 -3.75 20.5 20.5">
  <!-- The logo's Big Dipper on no tile, its stars a little bigger to read at
       16px: dark ink in a light browser, light ink in a dark one. -->
  <style>
    .ink { fill: #12120f; stroke: #12120f; }
    @media (prefers-color-scheme: dark) { .ink { fill: #f4f1ea; stroke: #f4f1ea; } }
  </style>
  <g class="ink">
    <path d="M19.4 4.2 19.2 8.4 15.1 9.1 15.3 5.2 Z M15.3 5.2 11.2 6.0 7.6 4.9 3.2 6.7" fill="none" stroke-width="0.9" stroke-linejoin="round" opacity="0.55"/>
    <g stroke="none">
      <circle cx="19.4" cy="4.2" r="1.75"/><circle cx="15.3" cy="5.2" r="1.3"/>
      <circle cx="15.1" cy="9.1" r="1.45"/><circle cx="19.2" cy="8.4" r="1.5"/>
      <circle cx="11.2" cy="6.0" r="2.05"/><circle cx="7.6" cy="4.9" r="1.55"/>
      <circle cx="3.2" cy="6.7" r="1.85"/>
    </g>
  </g>
</svg>
