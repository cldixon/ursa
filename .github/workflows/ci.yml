name: CI

# Skip the run when every changed file is docs or prose. The code in the docs
# pages and the README still runs on those changes: docs.yml's `examples` job
# covers it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "zensical.toml"
      - "**/*.md"
      - "LICENSE-*"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "zensical.toml"
      - "**/*.md"
      - "LICENSE-*"
      - ".github/workflows/docs.yml"

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (ruff, ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Static analysis only — install the dev tools but NOT the native extension.
      # `--no-install-project` skips the maturin/DataFusion build, so this job
      # returns in seconds instead of waiting on a full Rust compile. ruff and ty
      # read the source (and the ursa._ursa stub), never the compiled module.
      - name: Sync dev tools (no native build)
        run: uv sync --locked --no-install-project

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format
        run: uv run --no-sync ruff format --check .

      - name: ty
        run: uv run --no-sync ty check

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    # Line tables only: full debug info for every test binary of the workspace
    # filled the runner's disk and crashed the linker (signal 7, Bus error).
    # Backtraces keep their file and line numbers.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      # Pinned to match rust-toolchain.toml so clippy's lint set never drifts.
      # wasm32 target is added for the ursa-core portability check (#118).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # ursa-py is included here (not just core+plan): with `extension-module`
      # behind a feature, ursa-py's rlib now links a normal interpreter, so its
      # test binary builds. This guards the fix against regressing.
      - name: test core + io + plan + py
        run: cargo test -p ursa-core -p ursa-io -p ursa-plan -p ursa-py --locked

      # The SQL engine (#232): the engine session, the parser, and the `ursa`
      # binary's integration tests (which read python/ursa/datasets/data).
      - name: test engine + sql + cli + wasm (natively)
        run: cargo test -p ursa-engine -p ursa-sql -p ursa-cli -p ursa-wasm --locked

      # Ensures ursa-py (PyO3 extension) also compiles.
      - name: check workspace
        run: cargo check --workspace --locked

      # ursa-core portability (#118): the crate must build without rayon (the serial
      # fallback in src/parallel.rs) and for wasm32-unknown-unknown — the guard that
      # keeps the browser (Tier-3 viz) target open. Both are fast compile-only checks;
      # no test execution, no wasm runtime. They fail the moment a new kernel wires in
      # rayon (or any non-wasm dep) without a serial path.
      - name: check ursa-core without rayon (serial fallback)
        run: cargo check -p ursa-core --no-default-features --locked

      - name: check ursa-core on wasm32 (single-threaded)
        run: cargo check -p ursa-core --target wasm32-unknown-unknown --no-default-features --locked

      # The SQL engine in the browser (#277, #278): ursa-sql and everything under it
      # (ursa-engine, ursa-io, DataFusion) must keep building for wasm32. The cloud
      # stores and the multi-thread runtime are native-only dependencies; this fails
      # the moment one leaks onto the wasm32 build.
      - name: check the SQL engine on wasm32
        run: cargo clippy -p ursa-sql -p ursa-wasm --target wasm32-unknown-unknown --locked -- -D warnings

  wasm:
    # The SQL engine in the browser (#277): build ursa-wasm for wasm32, then run
    # the Getting Started SQL in headless Chromium and in the native binary and
    # require byte-identical output (ursa-wasm/tests/browser/parity.ts).
    name: Browser (wasm32 parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Must match the wasm-bindgen crate version in Cargo.lock.
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126

      - uses: oven-sh/setup-bun@v2

      - name: Install Playwright and Chromium
        run: |
          bun add --no-save playwright
          bunx playwright install --with-deps chromium

      - name: Build the native binary
        run: cargo build -p ursa-cli --locked

      - name: Build ursa-wasm
        run: |
          cargo build -p ursa-wasm --target wasm32-unknown-unknown --profile wasm-test --locked
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/wasm-test/ursa_wasm.wasm

      - name: Parity with the native engine
        run: bun ursa-wasm/tests/browser/parity.ts pkg target/debug/ursa

  web:
    # The Ursa Shell's Worker (web/, #279): generate the binding types from
    # cloudflare.config.ts with the cf CLI and type-check the Worker.
    name: Ursa Shell (Worker type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # cf runs on Node 22.18 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check

  pytest:
    name: Python (pytest, ${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Exercise both ends of the supported range and a second OS: the 3.10 floor
    # (requires-python / typing-extensions gate) and the newest 3.13 must both load
    # the single abi3-py310 wheel, and macOS must compile + import (it was never
    # built outside release before). Windows stays release-only (its first build of
    # a change is the release build; a dry run covers it).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    env:
      # uv builds/tests against this interpreter (auto-provisioned if absent), so
      # both steps below share one venv on the pinned version.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      # uv sync builds the maturin extension, so the Rust toolchain is needed here.
      # Pinned to match rust-toolchain.toml (single source of truth for the version).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync (build extension + dev group)
        run: uv sync --locked

      - name: pytest
        run: uv run --no-sync pytest

      # Benchmark-harness smoke: prove the cross-library flywheel still runs and
      # Ursa agrees with the NetworkX oracle on a tiny graph. Only on one leg —
      # it reuses the extension already built above and just adds the bench group
      # (typer/rich/rustworkx/networkx). Full benchmark runs happen off-CI on a
      # real box; this only guards the harness from bit-rotting.
      - name: Benchmark harness smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          uv sync --locked --group bench
          uv run --no-sync --group bench python benchmarks smoke
