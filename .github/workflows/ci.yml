name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test ursa-core
        run: cargo test -p ursa-core --locked

      # Ensures ursa-plan (DataFusion) and ursa-py compile, even though their
      # kernels are still scaffolded.
      - name: check workspace
        run: cargo check --workspace --locked

  python:
    name: Python (ruff, ty, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv sync builds the maturin extension, so the Rust toolchain is needed here too.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync (build extension + dev group)
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: ty
        run: uv run ty check

      - name: pytest
        run: uv run pytest
