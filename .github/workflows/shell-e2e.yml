name: Ursa Shell e2e

# The Ursa Web Shell end to end (#392): build the engine and the page, stage the
# sample datasets locally, serve them with the Worker's security headers
# (web/scripts/preview.ts) and run web/tests/e2e.ts in headless Chromium. No
# Cloudflare credentials: nothing here touches the account.
#
# Over both transports (URSA-5), so the browser demo and the native server stay
# one product: `worker` is the page with the wasm engine in a worker, as
# deployed; `socket` is the same page over a WebSocket to `ursa serve`'s native
# session (web/scripts/e2e-serve.ts), which skips exactly the suite's 6
# browser-only checks (the suite fails if it skips any other). The legs share
# the engine and datasets caches; each keeps its own cargo cache.
#
# And the Ursa Console (URSA-18), `ursa serve`'s own page at /console/: a third
# leg, `console`, built as the socket leg is (the same steps and caches: the
# engine and datasets, and the socket leg's cargo cache, as it builds the same
# ursa-cli), runs the console's suites (web/tests/console-all.ts) and keeps
# their screenshots of the console, light and dark, on every run.
#
# Runs when the page, the crates compiled into it, or the datasets' inputs
# change: web/, ursa-wasm and ursa-shell (the engine), ursa-viz (the graph
# view), the engine crates under them, the workspace's Cargo files and
# toolchain (profiles, versions), the bundled CSVs and the R-MAT generator;
# and the native server's own code: ursa-server and `ursa serve` (ursa-cli's
# serve.rs). The console's paths (web/console, web/public, web/tests/console*,
# ursa-shell's session) are under web/** and ursa-shell/**.
on:
  pull_request:
    paths:
      - "web/**"
      - "ursa-wasm/**"
      - "ursa-shell/**"
      - "ursa-viz/**"
      - "ursa-core/**"
      - "ursa-io/**"
      - "ursa-engine/**"
      - "ursa-sql/**"
      - "ursa-plan/**"
      - "ursa-server/**"
      - "ursa-cli/src/serve.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "python/ursa/datasets/data/**"
      - "benchmarks/sql_scale/gen.py"
      - ".github/workflows/shell-e2e.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "ursa-wasm/**"
      - "ursa-shell/**"
      - "ursa-viz/**"
      - "ursa-core/**"
      - "ursa-io/**"
      - "ursa-engine/**"
      - "ursa-sql/**"
      - "ursa-plan/**"
      - "ursa-server/**"
      - "ursa-cli/src/serve.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "python/ursa/datasets/data/**"
      - "benchmarks/sql_scale/gen.py"
      - ".github/workflows/shell-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The playwright package; `playwright install` fetches the Chromium build
  # this version drives, so the two always match.
  PLAYWRIGHT_VERSION: "1.63.0"
  PORT: "8788"

jobs:
  e2e:
    # The worker leg keeps the job's original name (the check PRs know).
    name: ${{ matrix.suite == 'console' && 'Ursa Console (browser e2e over ursa serve)' || matrix.transport == 'socket' && 'Ursa Shell (browser e2e over ursa serve)' || 'Ursa Shell (browser e2e)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One leg failing says nothing about the others: let all finish.
      fail-fast: false
      matrix:
        # `suite` is what runs: the shell's e2e (tests/e2e.ts) over either
        # transport, or the console's suites, which are socket only.
        include:
          - { transport: worker, suite: shell }
          - { transport: socket, suite: shell }
          - { transport: socket, suite: console }
    defaults:
      run:
        # bash -eo pipefail, so the tee'd e2e run fails the step.
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown

      # Dependencies only: rust-cache drops the workspace's own crates (cargo
      # would rebuild them anyway, checkout gives them new mtimes). A key per
      # leg, as the socket leg also builds the native ursa-cli's dependencies;
      # the worker leg's key is the one this job always had. The console leg
      # builds the same ursa-cli as the socket leg, so shares its key.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.transport == 'socket' && 'serve' || '' }}

      - name: Read the wasm-bindgen version from Cargo.lock
        id: wb
        working-directory: .
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # wasm-bindgen-cli must match the wasm-bindgen crate exactly.
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}

      - uses: oven-sh/setup-bun@v2

      - name: Install the page's dependencies
        run: bun install --frozen-lockfile

      # Not a dependency of the page, so not in package.json: added here, as
      # the Browser (wasm32 parity) job does, at a pinned version.
      - name: Install Playwright and Chromium
        run: |
          bun add --no-save "playwright@$PLAYWRIGHT_VERSION"
          bunx playwright install --with-deps chromium

      # The engine (ursa-wasm, wasm-release: fat LTO, the slow part) depends on
      # the engine crates and the Cargo files only, so a PR that changes only
      # the page reuses the last build of the same sources.
      - name: Restore the engine build
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: web/.engine
          key: shell-engine-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock', 'ursa-core/**', 'ursa-io/**', 'ursa-engine/**', 'ursa-sql/**', 'ursa-shell/**', 'ursa-wasm/**', 'web/scripts/engine.ts', 'web/scripts/common.ts') }}

      - name: Build the engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: bun run engine

      - name: Save the engine build
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/.engine
          key: ${{ steps.engine.outputs.cache-primary-key }}

      # dist/, with the graph view (ursa-viz, built by scripts/viz.ts).
      - name: Build the page
        run: bun run build

      # The datasets: the bundled CSVs, their Parquet (written by the native
      # ursa binary) and a seeded 1M-edge R-MAT (benchmarks/sql_scale/gen.py,
      # with uv). `--dry` stages them in .data/ and uploads nothing. Keyed by
      # their inputs; a miss builds ursa-cli --release, several minutes.
      - name: Restore the datasets
        id: data
        uses: actions/cache/restore@v4
        with:
          path: web/.data
          key: shell-data-${{ runner.os }}-${{ hashFiles('python/ursa/datasets/data/**', 'benchmarks/sql_scale/gen.py', 'web/scripts/upload-data.ts') }}

      - name: Install uv
        if: steps.data.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v6

      - name: Stage the datasets
        if: steps.data.outputs.cache-hit != 'true'
        run: bun run upload:data -- --dry

      - name: Save the datasets
        if: steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/.data
          key: ${{ steps.data.outputs.cache-primary-key }}

      - name: Serve the shell
        if: matrix.transport == 'worker'
        run: |
          mkdir -p e2e-out
          nohup bun scripts/preview.ts "$PORT" > e2e-out/preview.log 2>&1 &
          for _ in $(seq 60); do
            curl -sf -o /dev/null "http://localhost:$PORT/" && exit 0
            sleep 1
          done
          echo "the preview server did not start"; cat e2e-out/preview.log; exit 1

      # `.graph`'s data path without a browser (#425): the UGR bytes the
      # engine's graph::view writes (ursa-engine's fixtures), read by
      # ursa-viz/ui/ugr.js and shaped by public/graph-data.js.
      - name: The engine's graphs, read by the page
        if: matrix.transport == 'worker'
        run: bun test tests/graph-data.test.ts

      - name: Run the e2e suite
        if: matrix.transport == 'worker'
        run: bun run test:e2e "http://localhost:$PORT" e2e-out 2>&1 | tee e2e-out/e2e.log

      # The native server: `ursa serve` with the page's files from dist/.
      # A debug build: with cargo's dependencies cached, the workspace's crates
      # build in about two minutes in debug, against 25 in release (thin LTO,
      # one codegen unit), and the suite takes about a minute longer on the
      # debug server (measured for URSA-5).
      - name: Build ursa serve
        if: matrix.transport == 'socket'
        working-directory: .
        # No debug info: a smaller build and cache, and quicker links.
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build -p ursa-cli --features serve --locked

      # e2e-serve.ts starts `ursa serve .data --port PORT --no-open --assets dist`, reads
      # the token from the link it prints, runs the suite with it, and stops
      # the server with Ctrl+C, failing if it does not stop gracefully.
      - name: Run the e2e suite over ursa serve
        if: matrix.transport == 'socket' && matrix.suite == 'shell'
        env:
          URSA_BIN: ${{ github.workspace }}/target/debug/ursa
        run: |
          mkdir -p e2e-out
          bun scripts/e2e-serve.ts "$PORT" "$URSA_BIN" e2e-out 2>&1 | tee e2e-out/e2e.log

      # The console's suites (tests/console-all.ts): each starts its own
      # `ursa serve` from this build, on PORT, PORT + 1, ..., with the pages
      # from dist-console/ and dist/, and saves its screenshots in
      # e2e-out/<suite>/. It runs them all even when one fails.
      - name: Run the console suites
        if: matrix.suite == 'console'
        env:
          URSA_BIN: ${{ github.workspace }}/target/debug/ursa
        run: |
          mkdir -p e2e-out
          bun run test:console-all "$PORT" "$URSA_BIN" e2e-out 2>&1 | tee e2e-out/console-all.log

      - name: Upload screenshots and logs
        if: failure() && matrix.suite == 'shell'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.transport == 'socket' && 'shell-e2e-serve' || 'shell-e2e' }}
          path: web/e2e-out/
          if-no-files-found: ignore
          retention-days: 14

      # The console's screenshots, light and dark, on every run (not only on
      # failure), so a reviewer can see the UI; and the suites' logs.
      - name: Upload the console's screenshots and logs
        if: always() && matrix.suite == 'console'
        uses: actions/upload-artifact@v4
        with:
          name: console-e2e
          path: web/e2e-out/
          if-no-files-found: ignore
          retention-days: 14
