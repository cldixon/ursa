name: Release ursa-cli

# Releases the `ursa` command-line tool (crate ursa-cli) on the stable channel:
# builds it for five platforms (cli-build.yml), tags the built commit, publishes
# the five crates to crates.io, and makes a GitHub Release with the archives.
# The nightly channel is nightly-cli.yml.
#
# Separate from release.yml, which releases the Python package (ursa-graph)
# when a GitHub Release is published. The two never trigger each other: a
# release created here with the workflow's GITHUB_TOKEN does not start other
# workflows, and release.yml's publish job also skips ursa-cli-v* and nightly
# releases, in case one is published by hand.
#
# A release starts by itself when a release PR is merged: the merge to main
# that changes ursa-cli's version to a release version (0.8.0, not 0.8.0-dev),
# when the tag ursa-cli-v<version> does not exist yet. Every other merge to
# main stops in the first job, within seconds. So a release is:
#
#   1. A release PR sets all five crates to the version (0.8.0) and dates the
#      changelog. Merge it once CI is green.
#   2. This workflow builds and smoke-tests every target, tags the commit it
#      built as ursa-cli-v0.8.0, publishes to crates.io, and makes the GitHub
#      Release. No one needs to click anything.
#   3. A follow-up PR moves main to the next development version (0.9.0-dev),
#      which also restarts the nightly channel.
#
# A release candidate (0.8.0-rc.1) releases the same way: it goes to crates.io,
# where `cargo install` takes it only when asked for that exact version, and its
# GitHub Release is a prerelease, which the installers skip.
#
# Two other ways to start a release, e.g. to retry one whose run failed:
#
#   - Actions -> Release ursa-cli -> Run workflow, on main, with `release`
#     ticked and `version` set (e.g. 0.8.0). Unticked, the run is a dry run: it
#     builds and smoke-tests all five targets and publishes nothing.
#   - Pushing the tag yourself: git tag ursa-cli-v0.8.0 && git push origin
#     ursa-cli-v0.8.0.
#
# The version must match ursa-cli's in ursa-cli/Cargo.toml, and ursa-core,
# ursa-io, ursa-engine and ursa-sql must be at the same version, or the run
# stops before building.
#
# One-time setup (maintainer):
#   - GitHub, repository Settings -> Environments: `crates-io`. The publish job
#     runs in it, because crates.io's Trusted Publishing names it. Since
#     2026-11-07 it has no required reviewer, so a merged release PR publishes
#     with no human step. To limit who can publish, set its deployment branches
#     and tags to `main` and `ursa-cli-v*`. Adding a required reviewer back makes
#     every publish wait for approval again; nothing here needs to change.
#   - crates.io, Trusted Publishing: on each of the five crates' Settings page,
#     a GitHub publisher: repository cldixon/ursa, workflow release-cli.yml,
#     environment crates-io. The publish job then gets a short-lived token from
#     crates.io for each run; no API token is stored anywhere.
#
# Crates are published in dependency order, and a crate whose version is
# already on crates.io is skipped, so a run can be re-run, and crates published
# by hand first are not published twice.

on:
  push:
    branches: [main]
    tags: ["ursa-cli-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release: tag, publish to crates.io and make the GitHub Release. Unticked, a dry run."
        type: boolean
        default: false
      version:
        description: "The version to release, e.g. 0.8.0. Must match ursa-cli/Cargo.toml. Needed with release."
        type: string
        default: ""

# One group per merge, not per branch: GitHub cancels a run that is waiting in
# a group when a newer one joins it, and a release PR's merge must never be
# cancelled by the merge after it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # "true" to build: a release, or a dry run from the Actions tab.
      build: ${{ steps.version.outputs.build }}
      # "true" to release: tag, publish and make the GitHub Release.
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merged commit and its first parent, to see whether the merge
          # changed the version.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: ursa-cli's version, and whether to release it
        id: version
        shell: bash
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          crate_version() {
            cargo metadata --no-deps --format-version 1 --locked \
              | jq -r --arg c "$1" '.packages[] | select(.name == $c) | .version'
          }
          version=$(crate_version ursa-cli)
          echo "ursa-cli version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag_exists() {
            git ls-remote --exit-code --tags origin "refs/tags/ursa-cli-v$version" > /dev/null
          }
          build=false
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]]; then
            # A merge to main: release only the merge that set a new release
            # version. The version on the first parent is read from its
            # Cargo.toml, as cargo metadata needs a checkout.
            before=$(git show HEAD^:ursa-cli/Cargo.toml 2> /dev/null \
              | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1 || true)
            echo "before this merge: ${before:-unknown}"
            if [[ "$version" == *-dev ]]; then
              echo "$version is a development version: nothing to release (nightly-cli.yml builds it)"
            elif [[ "$version" == "$before" ]]; then
              echo "this merge did not change the version: nothing to release"
            elif tag_exists; then
              echo "the tag ursa-cli-v$version already exists: $version is released"
            else
              echo "this merge sets the release version $version: releasing"
              build=true
              publish=true
            fi
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "ursa-cli-v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match ursa-cli's version $version (expected ursa-cli-v$version)"
              exit 1
            fi
            build=true
            publish=true
          elif [[ "$RELEASE" == "true" ]]; then
            # A release from the Actions tab: on main, at the version asked for,
            # and not released already.
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::release from main only (this run is on $GITHUB_REF)"
              exit 1
            fi
            if [[ "${WANTED#v}" != "$version" ]]; then
              echo "::error::asked to release '$WANTED', but ursa-cli/Cargo.toml on this commit is $version. Merge the release PR first, or ask for $version"
              exit 1
            fi
            if tag_exists; then
              echo "::error::the tag ursa-cli-v$version already exists; $version is released"
              exit 1
            fi
            build=true
            publish=true
          else
            # A dry run from the Actions tab.
            build=true
          fi
          if [[ "$publish" == "true" && "$version" == *-dev ]]; then
            echo "::error::$version is a development version; the release PR sets the release version"
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "build: $build, publish: $publish"
          [[ "$build" == "true" ]] || exit 0
          # ursa-cli needs ursa-core, ursa-io, ursa-engine and ursa-sql from
          # crates.io, and a version already there is skipped below. So all five
          # are released together at one version: a crate left at an old version
          # would ship its old code under the new ursa-cli.
          for crate in ursa-core ursa-io ursa-engine ursa-sql; do
            v=$(crate_version "$crate")
            if [[ "$v" != "$version" ]]; then
              echo "::error::$crate is at $v but ursa-cli is at $version; release them at one version"
              exit 1
            fi
          done

  build:
    name: Build
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/cli-build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      label: v${{ needs.version.outputs.version }}

  tag:
    name: Tag the release
    # A release from a merge or from the Actions tab: tag the commit that was
    # just built, once every target built and passed its smoke test. (A tag
    # pushed by a person already exists.) A tag pushed with the workflow's token
    # does not start another run of this workflow.
    if: needs.version.outputs.publish == 'true' && github.ref_type == 'branch'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push the tag
        shell: bash
        env:
          TAG: ursa-cli-v${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ursa-cli ${TAG#ursa-cli-v}" "$GITHUB_SHA"
          git push origin "$TAG"

  crates:
    name: Publish to crates.io
    # A release, once it is tagged. A dry run stops after building.
    if: >-
      always() && needs.version.outputs.publish == 'true'
      && needs.build.result == 'success'
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    needs: [version, build, tag]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Trusted Publishing: the run's OIDC token is exchanged for a short-lived
      # crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Get a crates.io token (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # All five are at one version (the version job checks).
          for crate in ursa-core ursa-io ursa-engine ursa-sql ursa-cli; do
            version=$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "ursa release workflow (github.com/cldixon/ursa)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [[ "$status" == "200" ]]; then
              echo "$crate $version is already on crates.io; skipping"
              continue
            fi
            echo "publishing $crate $version"
            # cargo waits until the crate is in the index before returning, so
            # the next crate can depend on it.
            cargo publish --locked -p "$crate"
          done

  github-release:
    name: GitHub Release
    if: always() && needs.version.outputs.publish == 'true' && needs.crates.result == 'success'
    needs: [version, build, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ursa-cli-*
          merge-multiple: true
          path: dist
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ursa-cli-v${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          # A release candidate (0.8.0-rc.1) is a prerelease, which the
          # installers skip.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          # --latest=false keeps the Python package's release as the
          # repository's latest.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            "${prerelease[@]}" \
            --title "ursa-cli $VERSION" \
            --notes "The \`ursa\` command-line tool, version $VERSION: Ursa's SQL engine for graph analytics.

          Install with \`curl -fsSL https://cldixon.github.io/ursa/install.sh | sh\` on Linux or macOS, \`irm https://cldixon.github.io/ursa/install.ps1 | iex\` in PowerShell on Windows, or \`cargo install ursa-cli\`. Or download the archive for your platform below. Each archive holds the \`ursa\` binary; check it against its \`.sha256\` file.

          Changes: see [CHANGELOG.md](https://github.com/cldixon/ursa/blob/$TAG/CHANGELOG.md). Docs: https://cldixon.github.io/ursa/sql/"
