name: Release ursa-cli

# Builds the `ursa` binary (the SQL engine's command-line tool, crate ursa-cli)
# for five platforms, smoke-tests each build that can run on its runner, and,
# for a release tag only, publishes the crates to crates.io and the archives to
# a GitHub Release.
#
# Separate from release.yml, which releases the Python package (ursa-graph)
# when a GitHub Release is published. The two never trigger each other: this
# workflow runs on tags named ursa-cli-v*, and a release created here with the
# workflow's GITHUB_TOKEN does not start other workflows. release.yml's publish
# job also skips ursa-cli-v* releases, in case one is published by hand.
#
# Two ways to release, after the release PR (all five crates at the new
# version) is merged into main:
#
#   - From GitHub, no local git needed: Actions -> Release ursa-cli -> Run
#     workflow, on main, with `release` ticked and `version` set (e.g. 0.7.0).
#     The run checks the version, builds and smoke-tests every target, and only
#     then creates the tag ursa-cli-v<version> on the commit it built.
#   - By pushing the tag yourself: git tag ursa-cli-v0.7.0 && git push origin
#     ursa-cli-v0.7.0.
#
# Either way, publishing to crates.io waits for a person's approval of the
# `crates-io` environment, and the GitHub Release is made after that. Run
# without `release`, the workflow builds and smoke-tests all five targets as a
# dry run and publishes nothing.
#
# The version must match ursa-cli's in ursa-cli/Cargo.toml, and ursa-core,
# ursa-io, ursa-engine and ursa-sql must be at the same version, or the run
# stops before building.
#
# One-time setup (maintainer):
#   - GitHub, repository Settings -> Environments: `crates-io`, with yourself as
#     a required reviewer, so every publish waits for approval.
#   - crates.io, Trusted Publishing: on each of the five crates' Settings page,
#     add a GitHub publisher: repository cldixon/ursa, workflow release-cli.yml,
#     environment crates-io. The publish job then gets a short-lived token from
#     crates.io for each run; no API token is stored anywhere. (0.6.0, the
#     first release, used a token, since Trusted Publishing needs the crates to
#     exist.)
#
# Crates are published in dependency order, and a crate whose version is
# already on crates.io is skipped, so a run can be re-run, and crates published
# by hand first are not published twice.

on:
  push:
    tags: ["ursa-cli-v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release: tag, publish to crates.io (after approval) and make the GitHub Release. Unticked, a dry run."
        type: boolean
        default: false
      version:
        description: "The version to release, e.g. 0.7.0. Must match ursa-cli/Cargo.toml. Needed with release."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # "true" for a tag push, or a dispatch with `release`.
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: ursa-cli's version, and the tag
        id: version
        shell: bash
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
          WANTED: ${{ inputs.version }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "ursa-cli") | .version')
          echo "ursa-cli version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            publish=true
          elif [[ "$RELEASE" == "true" ]]; then
            # A release from the Actions tab: on main, at the version asked for,
            # and not released already.
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::release from main only (this run is on $GITHUB_REF)"
              exit 1
            fi
            if [[ "${WANTED#v}" != "$version" ]]; then
              echo "::error::asked to release '$WANTED', but ursa-cli/Cargo.toml on this commit is $version. Merge the release PR first, or ask for $version"
              exit 1
            fi
            if [[ "$version" == *-* ]]; then
              echo "::error::$version is a development version; the release PR sets the release version"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/ursa-cli-v$version" > /dev/null; then
              echo "::error::the tag ursa-cli-v$version already exists; $version is released"
              exit 1
            fi
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish: $publish"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "ursa-cli-v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match ursa-cli's version $version (expected ursa-cli-v$version)"
            exit 1
          fi
          # ursa-cli needs ursa-core, ursa-io, ursa-engine and ursa-sql from
          # crates.io, and a version already there is skipped below. So all five
          # are released together at one version: a crate left at an old version
          # would ship its old code under the new ursa-cli.
          for crate in ursa-core ursa-io ursa-engine ursa-sql; do
            v=$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if [[ "$v" != "$version" ]]; then
              echo "::error::$crate is at $v but ursa-cli is at $version; release them at one version"
              exit 1
            fi
          done

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04, so the binary needs glibc 2.35 or later.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, native: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, native: true }
          # macos-latest is Apple silicon; the Intel build cross-compiles there.
          - { target: aarch64-apple-darwin, os: macos-latest, native: true }
          - { target: x86_64-apple-darwin, os: macos-latest, native: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, native: true }
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: ursa-cli-v${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to match rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked -p ursa-cli --target "$TARGET"

      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          bin="target/$TARGET/release/ursa"
          "$bin" --version
          test "$("$bin" --version)" = "ursa ${{ needs.version.outputs.version }}"
          out=$("$bin" --format csv -c "
            CREATE VIEW ties AS SELECT * FROM 'python/ursa/datasets/data/karate_edges.csv';
            CREATE PROPERTY GRAPH karate EDGE TABLES (ties SOURCE KEY (src) DESTINATION KEY (dst));
            SELECT count(*) AS n FROM pagerank(karate, direction => 'both');")
          echo "$out"
          test "$(echo "$out" | tr -d '\r' | tail -n 1)" = "34"

      # docs/install.sh and docs/install.ps1 download these archives by name,
      # and expect this layout and the .sha256 format: change them together.
      - name: Package
        shell: bash
        run: |
          mkdir "$ARCHIVE"
          if [[ "$TARGET" == *windows* ]]; then exe=ursa.exe; else exe=ursa; fi
          cp "target/$TARGET/release/$exe" ursa-cli/README.md LICENSE-MIT LICENSE-APACHE "$ARCHIVE/"
          if [[ "$TARGET" == *windows* ]]; then
            7z a "$ARCHIVE.zip" "$ARCHIVE" > /dev/null
            file="$ARCHIVE.zip"
          else
            tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
            file="$ARCHIVE.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$file" > "$file.sha256"
          else
            shasum -a 256 "$file" > "$file.sha256"
          fi
          cat "$file.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ursa-cli-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}.tar.gz
            ${{ env.ARCHIVE }}.zip
            ${{ env.ARCHIVE }}.*.sha256
          if-no-files-found: error

  tag:
    name: Tag the release
    # A release from the Actions tab: tag the commit that was just built, once
    # every target built and passed its smoke test. (A tag pushed by a person
    # already exists.) A tag pushed with the workflow's token does not start
    # another run of this workflow.
    if: github.event_name == 'workflow_dispatch' && needs.version.outputs.publish == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push the tag
        shell: bash
        env:
          TAG: ursa-cli-v${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ursa-cli ${TAG#ursa-cli-v}" "$GITHUB_SHA"
          git push origin "$TAG"

  crates:
    name: Publish to crates.io
    # A tag push, or a release from the Actions tab once it is tagged. A dry
    # run stops after building.
    if: >-
      always() && needs.version.outputs.publish == 'true'
      && needs.build.result == 'success'
      && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    needs: [version, build, tag]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      # Trusted Publishing: the run's OIDC token is exchanged for a short-lived
      # crates.io token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Get a crates.io token (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # All five are at one version (the version job checks).
          for crate in ursa-core ursa-io ursa-engine ursa-sql ursa-cli; do
            version=$(cargo metadata --no-deps --format-version 1 --locked \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "ursa release workflow (github.com/cldixon/ursa)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [[ "$status" == "200" ]]; then
              echo "$crate $version is already on crates.io; skipping"
              continue
            fi
            echo "publishing $crate $version"
            # cargo waits until the crate is in the index before returning, so
            # the next crate can depend on it.
            cargo publish --locked -p "$crate"
          done

  github-release:
    name: GitHub Release
    if: always() && needs.version.outputs.publish == 'true' && needs.crates.result == 'success'
    needs: [version, build, crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ursa-cli-*
          merge-multiple: true
          path: dist
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ursa-cli-v${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          # --latest=false keeps the Python package's release as the
          # repository's latest.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=false \
            --title "ursa-cli $VERSION" \
            --notes "The \`ursa\` command-line tool, version $VERSION: Ursa's SQL engine for graph analytics.

          Install with \`curl -fsSL https://cldixon.github.io/ursa/install.sh | sh\` on Linux or macOS, \`irm https://cldixon.github.io/ursa/install.ps1 | iex\` in PowerShell on Windows, or \`cargo install ursa-cli\`. Or download the archive for your platform below. Each archive holds the \`ursa\` binary; check it against its \`.sha256\` file.

          Changes: see [CHANGELOG.md](https://github.com/cldixon/ursa/blob/$TAG/CHANGELOG.md). Docs: https://cldixon.github.io/ursa/sql/"
