name: Docs

# The documentation site: Zensical builds docs/ into a static site, and GitHub
# Pages serves it at https://cldixon.github.io/ursa/.
#
# Two jobs. `build` runs on every pull request that touches the docs and on every
# push to main, in strict mode, so a broken link or a page missing from the nav
# fails the check instead of shipping. `deploy` runs only on main, after a
# successful build, and publishes through the Pages deployment API — no gh-pages
# branch, no committed build output.
#
# Deliberately separate from ci.yml: the docs never gate the code and the code
# build never gates the docs. Nothing here needs the native extension; the pages
# are markdown with their example output committed, so the build is seconds.
#
# One-time setup (repository Settings -> Pages): set Source to "GitHub Actions".
# The site lives under the repository path, so `site_url` in zensical.toml
# carries the /ursa/ prefix; there is no custom domain.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "CHANGELOG.md"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "CHANGELOG.md"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # zensical needs Python 3.11+ (the package itself supports 3.10).
          python-version: "3.13"

      # Only the `docs` dependency group: zensical and nothing else. No native
      # build, no Rust toolchain.
      - name: Install zensical
        run: uv sync --locked --only-group docs

      - name: Build (strict)
        run: uv run --no-sync zensical build --clean --strict

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
