[package]
name = "ursa-viz"
description = "Ursa's graph view: a live ForceAtlas2 layout drawn with wgpu (WebGPU, WebGL2, or native), for the SQL shell and the DataFrame API alike."
version = "0.12.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://cldixon.github.io/ursa/"
keywords = ["graph", "visualization", "wgpu", "layout"]
categories = ["visualization", "graphics"]
# Published with the SQL engine's crates: `ursa-engine` depends on the model
# here (default features off) to write graph results (#425).

# A library first: the view takes a graph as a node count and dense src/dst
# ids, so it knows nothing of SQL, DataFusion or Python. The `web` feature
# adds the wasm-bindgen API the browser shell uses.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `render` is the GPU: wgpu, the renderer and `View`. Without it
# (`default-features = false`) the crate is the core alone: the graph-result
# model, deltas, the UGR wire format and the scene, with no wgpu in the tree.
# That is what `ursa-engine` depends on.
default = ["render"]
render = ["dep:wgpu", "dep:futures-channel"]
web = ["render", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:console_error_panic_hook"]

[dependencies]
# Serial ursa-core: the browser has one thread, and the layout is the same
# bits either way.
ursa-core = { path = "../ursa-core", version = "0.12.0-dev", default-features = false }
# Backends per target: WebGPU, falling back to WebGL2, in the browser. A native
# window would add Vulkan, Metal and DX12 here.
wgpu = { version = "29.0.4", default-features = false, features = ["std", "wgsl"], optional = true }
# Vertex data for the GPU, and the UGR wire format's sections.
bytemuck = { version = "1", features = ["derive"] }
# The UGR wire format's JSON header.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one-shot that hands a mapped readback buffer back to async code.
futures-channel = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2.126", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["HtmlCanvasElement", "Window", "Performance", "console"] }
console_error_panic_hook = { version = "0.1.7", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29.0.4", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"], optional = true }

[dev-dependencies]
# Validates the WGSL natively, so a shader error fails `cargo test`, not
# only the browser.
naga = { version = "29.0.4", features = ["wgsl-in"] }
