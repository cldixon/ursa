[package]
name = "ursa-sql"
description = "Ursa's SQL dialect: DataFusion's parser plus Ursa's own statements, and running them on an engine session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ursa-engine = { path = "../ursa-engine" }
datafusion = { workspace = true }
# Opening a database may wait for another process's lock, off the async workers.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
