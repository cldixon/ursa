[package]
name = "ursa-io"
description = "Source reading for Ursa: Parquet/CSV scans through DataFusion, CSV options and inference, object_store/URL handling. No plan types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ursa-core = { path = "../ursa-core" }
arrow = { workspace = true }
datafusion = { workspace = true }
rayon = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# Matches a CSV scan's `null_value` literally (already in the tree via DataFusion).
regex = "1"
# Reads the CSV sample DataFusion infers types from (#221), as arrow-csv does
# (already in the tree via arrow-csv).
csv = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
