[package]
name = "ursa-io"
description = "Source reading for Ursa: Parquet/CSV scans through DataFusion, CSV options and inference, object_store/URL handling. No plan types."
# Released with ursa-engine, ursa-sql and ursa-cli, in lockstep at the CLI's
# version (release-cli.yml checks); the Python package keeps the workspace version.
version = "0.7.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://cldixon.github.io/ursa/"
keywords = ["parquet", "csv", "graph", "datafusion", "object-store"]
categories = ["database", "encoding"]

[dependencies]
# `ursa-core`'s `rayon` feature is native only (below): in the browser the
# kernels take their serial path, whose results are bit-identical (#278).
ursa-core = { path = "../ursa-core", version = "0.7.0-dev", default-features = false }
arrow = { workspace = true }
datafusion = { workspace = true }
rayon = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }
futures = "0.3"
tokio = { version = "1", features = ["rt"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# Matches a CSV scan's `null_value` literally (already in the tree via DataFusion).
regex = "1"
# Reads the CSV sample DataFusion infers types from (#221), as arrow-csv does
# (already in the tree via arrow-csv).
csv = "1"

# Native only: the local file system and cloud stores, and the multi-thread
# runtime the blocking scan entry points share (see `runtime.rs`). None of these
# build for wasm32 (#278).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ursa-core = { path = "../ursa-core", version = "0.7.0-dev", features = ["rayon"] }
object_store = { workspace = true, features = ["fs", "aws", "gcp", "azure"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

# wasm32 (the browser): DataFusion's tree carries `getrandom` 0.2, 0.3 and 0.4,
# and each needs its JavaScript backend chosen on wasm32-unknown-unknown. 0.3
# also reads `--cfg getrandom_backend="wasm_js"`, set in `.cargo/config.toml`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
