[package]
name = "ursa-shell"
description = "Ursa's shell apart from the terminal: dot-commands, results drawn as tables, and SQL highlighting, shared by the ursa CLI and the browser shell."
version = "0.14.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://cldixon.github.io/ursa/"
keywords = ["sql", "graph", "shell", "cli"]
categories = ["command-line-utilities", "database-implementations"]

[features]
# `OutputFormat` as a clap value (`ursa --format`).
clap = ["dep:clap"]

[dependencies]
ursa-engine = { path = "../ursa-engine", version = "0.14.0-dev" }
ursa-sql = { path = "../ursa-sql", version = "0.14.0-dev" }
# The graph model's delta, which an explore command gives the host's view. No
# default features: no GPU.
ursa-viz = { path = "../ursa-viz", version = "0.14.0-dev", default-features = false }
arrow = { workspace = true, features = ["ipc"] }
datafusion = { workspace = true }
futures = "0.3"
# The session's files (`session::Session`), in memory at memory://uploads/.
object_store = { workspace = true }
# The session protocol's messages (`session`).
serde_json = "1"
url = { workspace = true }
unicode-width = "0.2"
# A clock that works in the browser too (std's Instant panics there).
web-time = "1.1"
clap = { version = "4.5", features = ["derive"], optional = true }

# getrusage, for `.timer`'s user and sys times.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile = "3"
